apiVersion: v1
kind: ServiceAccount
metadata:
  name: wuji-core-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wuji-core-control
rules:
  - apiGroups: [""]
    resources: [pods, configmaps, secrets, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wuji-core-control
subjects:
  - kind: ServiceAccount
    name: wuji-core-control
    namespace: wuji-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wuji-core-control
