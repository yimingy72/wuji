[project]
name = "wuji-workspace"
version = "0.4.0"
requires-python = "==3.13.15"
dependencies = [
  "pyyaml==6.0.3",
  "wuji-api",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "openapi-core==0.23.1",
  "pytest==9.1.1",
]
agent-validation = [
  "wuji-agent-integration",
]
task-runtime = [
  "wuji-task-runtime",
]
cairn-bridge = [
  "wuji-cairn-bridge",
]

[tool.uv]
package = false

[tool.uv.sources]
wuji-api = { workspace = true }
wuji-agent-integration = { workspace = true }
wuji-task-runtime = { workspace = true }
wuji-cairn-bridge = { workspace = true }
cairn = { git = "https://github.com/oritera/Cairn.git", rev = "8e7e0ea67552383851dfcabfba0c4e9c8d007878", subdirectory = "cairn" }

[tool.uv.workspace]
members = ["apps/api", "packages/agent-integration", "packages/task-runtime", "packages/cairn-bridge"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["apps/api/tests"]
markers = [
  "unit: isolated checks that do not require Kubernetes or external services",
  "platform: full Docker Desktop Phase 1A integration tests",
]
