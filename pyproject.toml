[project]
name = "wuji-workspace"
version = "0.4.0"
requires-python = "==3.13.15"
dependencies = [
  "pyyaml==6.0.3",
  "wuji-api",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "openapi-core==0.23.1",
  "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.uv.sources]
wuji-api = { workspace = true }

[tool.uv.workspace]
members = ["apps/api"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["apps/api/tests"]
markers = [
  "unit: isolated checks that do not require Kubernetes or external services",
  "platform: full Docker Desktop Phase 1A integration tests",
]
