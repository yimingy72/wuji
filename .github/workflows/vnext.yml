name: vNext checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.11"

jobs:
  contract-and-python:
    name: v2 contract and vNext Python suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # The repository pins its own uv and Python under work/toolchain; the
      # script fetches exactly that version instead of whatever is on PATH.
      - run: ./scripts/bootstrap-toolchain.sh
      - name: Write the isolated PostgreSQL fixture manifest
        run: |
          mkdir -p work/vnext
          cat > work/vnext/postgres-fixture.json <<'JSON'
          {
            "binary_dir": "/usr/lib/postgresql/16/bin",
            "data_dir": "/tmp/wuji-vnext-pgdata",
            "socket_dir": "127.0.0.1",
            "port": 5432,
            "user": "postgres",
            "database": "postgres",
            "version": "PostgreSQL 16 (service container, TCP)",
            "network": "TCP 127.0.0.1:5432; CI-only fixture administrator"
          }
          JSON
      - run: pnpm contracts:check:v2
      - name: vNext Python suites (real isolated PostgreSQL per case)
        run: pnpm test:vnext
        env:
          UV_PYTHON_DOWNLOADS: never

  web:
    name: web typecheck, build and topology tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wuji/web typecheck
      - run: pnpm --filter @wuji/web build
      - name: Topology unit tests
        run: pnpm exec vitest run apps/web/src/features/topology
