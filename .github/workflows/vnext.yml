name: vNext checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.11"

jobs:
  contract-and-python:
    name: v2 contract and vNext Python suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Upgrade tests replay real historical files with `git show <sha>`, so the
      # job needs the pinned history rather than the default single commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # The repository pins its own uv and Python under work/toolchain; the
      # script fetches exactly that version instead of whatever is on PATH.
      - run: ./scripts/bootstrap-toolchain.sh
      # The frozen toolchain path is what the contract generator and the Node
      # child tests resolve. Node comes from the pinned setup-node version (the
      # exact one in .node-version) and pnpm from corepack's pinned manager
      # (package.json / toolchain manifest); nothing is an unlocked "latest".
      - name: Provision the frozen toolchain entrypoints
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          mkdir -p work/toolchain/bin
          for tool in node npm npx; do
            ln -sf "$(command -v "$tool")" "work/toolchain/bin/$tool"
          done
          test -x work/toolchain/bin/node
          test "$(work/toolchain/bin/node --version)" = "v$(cat .node-version)"
          corepack enable --install-directory work/toolchain/bin
          test -x work/toolchain/bin/pnpm
          test "$(work/toolchain/bin/pnpm --version)" = "10.32.1"
      # The frozen pnpm installs the workspace exactly as the lock file records
      # it; the web job's install is not a dependency of this job.
      - name: Install the frozen workspace dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: work/toolchain/bin/pnpm install --frozen-lockfile
      - name: Write the isolated PostgreSQL fixture manifest
        run: |
          mkdir -p work/vnext
          cat > work/vnext/postgres-fixture.json <<'JSON'
          {
            "binary_dir": "/usr/lib/postgresql/16/bin",
            "data_dir": "/tmp/wuji-vnext-pgdata",
            "socket_dir": "127.0.0.1",
            "port": 5432,
            "user": "postgres",
            "database": "postgres",
            "version": "PostgreSQL 16 (service container, TCP)",
            "network": "TCP 127.0.0.1:5432; CI-only fixture administrator"
          }
          JSON
      - name: v2 contract check
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: work/toolchain/bin/pnpm contracts:check:v2
      # CI-03: the contract check must still catch a tampered generated DTO.
      # A check that passes on anything is not a gate.
      - name: Contract check has teeth (negative control)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          cp packages/wuji-core/src/wuji_core/contracts/generated.py /tmp/generated.py.keep
          printf '\n# tampered by the CI negative control\n' >> packages/wuji-core/src/wuji_core/contracts/generated.py
          if ./scripts/vnext/uv.sh run --frozen python scripts/vnext/generate_contracts.py --check; then
            echo "::error::the contract check accepted a tampered DTO"
            cp /tmp/generated.py.keep packages/wuji-core/src/wuji_core/contracts/generated.py
            exit 1
          fi
          cp /tmp/generated.py.keep packages/wuji-core/src/wuji_core/contracts/generated.py
          ./scripts/vnext/uv.sh run --frozen python scripts/vnext/generate_contracts.py --check
      - name: Node Supervisor suites
        run: node --test tests/task-workers/*.test.mjs
      - name: vNext Python suites (real isolated PostgreSQL per case)
        env:
          UV_PYTHON_DOWNLOADS: never
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: work/toolchain/bin/pnpm test:vnext

  web:
    name: web typecheck, build and topology tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wuji/web typecheck
      - run: pnpm --filter @wuji/web build
      - name: Topology unit tests
        # The topology suites live under tests/topology with their own vitest
        # config; the application sources carry no colocated test files.
        run: pnpm exec vitest run --config tests/topology/vitest.config.ts
      - name: Topology browser tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --config playwright.topology.config.ts
