[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "wuji-task-runtime"
version = "0.1.0"
description = "Wuji single-Pod task execution infrastructure"
requires-python = "==3.13.15"
dependencies = ["kubernetes==36.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/wuji_task_runtime"]
