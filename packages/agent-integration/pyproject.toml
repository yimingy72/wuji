[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "wuji-agent-integration"
version = "0.1.0"
description = "Isolated model-client and harness validation adapter for Wuji"
requires-python = "==3.13.15"
dependencies = [
  "deepagents==0.7.13",
  "langchain==1.4.0",
  "langchain-anthropic==1.7.1",
  "langchain-openai==1.6.2",
  "langgraph==1.2.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wuji_agent_integration"]
