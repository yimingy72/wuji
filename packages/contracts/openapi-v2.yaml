        projection_version: {type: string, minLength: 1, maxLength: 256}
        nodes:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/TopologyNode'}
        edges:
          type: array
          maxItems: 2000
          items: {$ref: '#/components/schemas/TopologyEdge'}
        opaque_cursor: {type: string, minLength: 1, maxLength: 4096}
        truncated: {type: boolean}
        continuation:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 4096
            - type: 'null'
        allowed_actions:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
    ViewEventBatch:
      type: object
      additionalProperties: false
