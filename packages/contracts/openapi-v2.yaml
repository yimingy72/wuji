    WorkerControl:
      type: object
      additionalProperties: false
      required: [schema_version, operation_id, identity, action, reason]
      properties:
        schema_version: {$ref: '#/components/schemas/ApiSchemaVersion'}
        operation_id: {type: string, minLength: 1}
        identity: {$ref: '#/components/schemas/RunIdentity'}
        action: {$ref: '#/components/schemas/ControlAction'}
