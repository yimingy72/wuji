      properties:
        snapshot_id: {type: string, minLength: 1}
        view_id: {type: string, minLength: 1}
        view_revision: {$ref: '#/components/schemas/RevisionString'}
        created_at: {type: string, format: date-time}
        query_digest: {type: string, minLength: 1}
        projection_version: {type: string, minLength: 1}
        query:
          oneOf:
            - $ref: '#/components/schemas/ViewQuery'
