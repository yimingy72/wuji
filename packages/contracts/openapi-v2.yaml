openapi: 3.1.0
info:
  title: Wuji vNext API
  version: 2.0.0
  description: >-
    Authoritative external wire contract for the isolated Wuji vNext runtime.
    Domain services are supplied by later stages; this document fixes their
    authenticated HTTP and worker boundaries.
servers:
  - url: /
    description: Same-origin Wuji vNext API
security:
  - BearerAuth: []
tags:
  - name: Tasks
    description: Task and WorkItem creation and lifecycle commands.
  - name: Knowledge
    description: Candidate knowledge, assessments, and immutable evidence access.
  - name: Views
    description: Authorized snapshots, records, layouts, streams, and archives.
  - name: Approvals
    description: Versioned human decisions for registered approval requests.
  - name: Internal
    description: Trusted worker, supervisor, evidence, result, and model boundaries.
paths:
  /api/v2/tasks:
    post:
      operationId: createTaskV2
      summary: Create a non-running vNext task
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created in the non-running ready state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /api/v2/tasks/{task_id}/commands:
    post:
      operationId: commandTaskV2
      summary: Submit a guarded task lifecycle command
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCommand'
      responses:
        '202': {$ref: '#/components/responses/CommandAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /api/v2/tasks/{task_id}/claims/proposals:
    post:
      operationId: proposeClaimV2
      summary: Propose an unassessed claim
      tags: [Knowledge]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimProposal'
      responses:
        '202': {$ref: '#/components/responses/ComponentAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /api/v2/tasks/{task_id}/intents/proposals:
    post:
      operationId: proposeIntentV2
      summary: Propose a controlled exploration intent
      tags: [Knowledge]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentProposal'
      responses:
        '202': {$ref: '#/components/responses/ComponentAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /api/v2/work-items/{work_item_id}/commands:
    post:
      operationId: commandWorkItemV2
      summary: Submit a guarded WorkItem command
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkCommand'
      responses:
        '202': {$ref: '#/components/responses/CommandAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /api/v2/approvals/{approval_id}/decisions:
    post:
      operationId: decideApprovalV2
      summary: Decide a fixed approval request
      tags: [Approvals]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '202': {$ref: '#/components/responses/CommandAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /api/v2/tasks/{task_id}/assessments:
    post:
      operationId: recordAssessmentV2
      summary: Record a qualified assessment
      tags: [Knowledge]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCommand'
      responses:
        '202':
          description: Assessment recorded for checking or rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentReceipt'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /api/v2/tasks/{task_id}/topology:
    get:
      operationId: getTaskTopologyV2
      summary: Read a stable authorized topology snapshot
      tags: [Views]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/ViewMode'
        - $ref: '#/components/parameters/SnapshotIdQuery'
        - $ref: '#/components/parameters/ViewCursor'
        - $ref: '#/components/parameters/NodeLimit'
        - $ref: '#/components/parameters/EdgeLimit'
      responses:
        '200':
          description: Authorized stable topology snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologySnapshot'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
        '410': {$ref: '#/components/responses/Expired'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /api/v2/views/{view_id}/events:
    get:
      operationId: streamViewEventsV2
      summary: Stream authorized atomic view changes
      tags: [Views]
      parameters:
        - $ref: '#/components/parameters/ViewId'
        - $ref: '#/components/parameters/ViewCursor'
      responses:
        '200':
          description: Authorized SSE stream of atomic view batches or resets
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ViewEventBatch'
                  - $ref: '#/components/schemas/ViewReset'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
        '410': {$ref: '#/components/responses/Expired'}
  /api/v2/tasks/{task_id}/snapshots:
    get:
      operationId: listTaskSnapshotsV2
      summary: List retained authorized snapshots
      tags: [Views]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/ViewCursor'
      responses:
        '200':
          description: Authorized saved snapshot index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotIndex'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
  /api/v2/tasks/{task_id}/records/{record_type}/{record_id}:
    get:
      operationId: getTaskRecordV2
      summary: Read an immutable authorized record revision
      tags: [Views]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/RecordType'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/RevisionQuery'
      responses:
        '200':
          description: Authorized immutable record revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordView'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /api/v2/tasks/{task_id}/layouts/{view_name}:
    put:
      operationId: putTaskLayoutV2
      summary: Update a versioned personal topology layout
      tags: [Views]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/ViewName'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutPatch'
      responses:
        '200':
          description: Updated personal layout revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutReceipt'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /api/v2/artifacts/{artifact_id}/content:
    get:
      operationId: getArtifactContentV2
      summary: Stream authorized immutable artifact bytes
      tags: [Knowledge]
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/ArtifactVersionQuery'
      responses:
        '200':
          description: Authorized immutable artifact bytes
          headers:
            Digest:
              required: true
              schema: {type: string, minLength: 1}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
  /api/v2/archives/{archive_id}:
    get:
      operationId: getArchiveV2
      summary: Read an imported non-executable archive
      tags: [Views]
      parameters:
        - $ref: '#/components/parameters/ArchiveId'
      responses:
        '200':
          description: Read-only imported archive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveView'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFoundOrForbidden'}
  /internal/v2/model/chat/completions:
    post:
      operationId: createModelChatCompletionV2
      summary: Admit a run-scoped model protocol request
      tags: [Internal]
      parameters:
        - $ref: '#/components/parameters/TrustedRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Admitted model protocol response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
        '429': {$ref: '#/components/responses/LimitBlocked'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /internal/v2/evidence:
    post:
      operationId: ingestEvidenceV2
      summary: Ingest a trusted capture envelope
      tags: [Internal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureEnvelope'
      responses:
        '202':
          description: Evidence receipt persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceReceipt'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /internal/v2/results:
    post:
      operationId: submitResultV2
      summary: Receive a trusted result envelope
      tags: [Internal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultEnvelope'
      responses:
        '202':
          description: Raw result received for component validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultReceipt'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /internal/v2/dispatch/claims:
    post:
      operationId: claimDispatchWorkV2
      summary: Claim work under the current leader epoch
      tags: [Internal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimWork'
      responses:
        '200':
          description: Atomic dispatch claim receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchReceipt'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/LimitBlocked'}
  /internal/v2/runs/{run_id}:
    put:
      operationId: prepareRunV2
      summary: Prepare one stable worker start operation
      tags: [Internal]
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerAssignment'
      responses:
        '200':
          description: Stable start operation receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartReceipt'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
  /internal/v2/runs/{run_id}/control:
    post:
      operationId: controlRunV2
      summary: Submit a run control request without implying exit
      tags: [Internal]
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerControl'
      responses:
        '202':
          description: Control request accepted; this is not an exit receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlReceipt'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidSchema'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {$ref: '#/components/schemas/RevisionString'}
    TrustedRequestId:
      name: X-Wuji-Request-ID
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    WorkItemId:
      name: work_item_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ViewId:
      name: view_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ViewName:
      name: view_name
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    RecordType:
      name: record_type
      in: path
      required: true
      schema: {$ref: '#/components/schemas/NodeEntityType'}
    RecordId:
      name: record_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ArchiveId:
      name: archive_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ViewMode:
      name: mode
      in: query
      required: false
      schema: {$ref: '#/components/schemas/ViewMode'}
    SnapshotIdQuery:
      name: snapshot_id
      in: query
      required: false
      schema: {type: string, minLength: 1}
    ViewCursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 4096}
    RevisionQuery:
      name: revision
      in: query
      required: true
      schema: {$ref: '#/components/schemas/RevisionString'}
    ArtifactVersionQuery:
      name: version
      in: query
      required: true
      schema: {$ref: '#/components/schemas/RevisionString'}
    NodeLimit:
      name: node_limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 1000, default: 300}
    EdgeLimit:
      name: edge_limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 2000, default: 600}
  responses:
    CommandAccepted:
      description: Command accepted for authoritative processing
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommandReceipt'}
    ComponentAccepted:
      description: Proposal component accepted or rejected independently
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ComponentReceipt'}
    Unauthenticated:
      description: Missing or invalid authenticated identity
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Authenticated principal is not eligible for this operation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFoundOrForbidden:
      description: Object is absent or hidden by the current read scope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Version, execution, digest, or operation state conflicts
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Expired:
      description: Requested retained history or view is unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InvalidSchema:
      description: Request does not satisfy the versioned input contract
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    LimitBlocked:
      description: A published hard limit prevents admission
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unavailable:
      description: Required runtime capability is unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    RevisionString:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
    DecimalString:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
    Sha256Digest:
      type: string
      pattern: '^[a-f0-9]{64}$'
    ApiSchemaVersion:
      type: string
      enum: [wuji.api.v2]
    AssignmentSchemaVersion:
      type: string
      enum: [wuji.assignment.v2]
    ResultEnvelopeSchemaVersion:
      type: string
      enum: [wuji.result-envelope.v2]
    AgentPayloadSchemaVersion:
      type: string
      enum: [wuji.agent-payload.v2]
    ViewEventSchemaVersion:
      type: string
      enum: [wuji.view-event.v2]
    ViewResetSchemaVersion:
      type: string
      enum: [wuji.view-reset.v2]
    CaptureSchemaVersion:
      type: string
      enum: [wuji.capture.v2]
    ClaimKind:
      type: string
      enum: [observation-summary, hypothesis, derived-conclusion]
    AssertionRole:
      type: string
      enum: [candidate_fact, explanation, hypothesis]
    ProducerKind:
      type: string
      enum: [agent, human, extractor, import]
    GroundingState:
      type: string
      enum: [unchecked, linked, content_checked, invalid]
    EvidenceState:
      type: string
      enum: [unassessed, supported, contradicted, inconclusive]
    ApplicabilityState:
      type: string
      enum: [current, stale, disputed, retracted]
    AssessmentMethod:
      type: string
      enum: [deterministic, reproduced_check, human_attestation, model_review]
    WorkKind:
      type: string
      enum: [reason, explore, report]
    IntentAcceptance:
      type: string
      enum: [proposed, admitted, rejected, superseded]
    WorkDesired:
      type: string
      enum: [run, hold, cancel]
    WorkState:
      type: string
      enum: [ready, leased, running, waiting_input, blocked, stopping, suspended, reconciling, done, failed, cancelled]
    RunProcessState:
      type: string
      enum: [registered, starting, running, stopping, exited, unknown]
    RunResultState:
      type: string
      enum: [none, received, accepted, rejected, historical_only, incomplete]
    TaskDesired:
      type: string
      enum: [run, pause, cancel, finish]
    TaskObserved:
      type: string
      enum: [ready, running, quiescing, paused, reconciling, closed]
    CloseTrigger:
      type: string
      enum: [goal_satisfied, user_cancel, budget_exhausted, time_limit, no_progress, system_failure, operator_finish]
    ResultOutcome:
      type: string
      enum: [complete, partial, inconclusive, not_assessed]
    GoalStatus:
      type: string
      enum: [met, not_met, unknown, not_applicable]
    DependencyCondition:
      type: string
      enum: [settled, accepted_result, criterion_satisfied]
    RecoveryClass:
      type: string
      enum: [settled_boundary, approval_boundary, non_resumable]
    ResultReceiptStatus:
      type: string
      enum: [received, accepted, rejected, historical_only]
    ComponentReceiptStatus:
      type: string
      enum: [accepted_shared, accepted_for_check, rejected]
    EvidenceReceiptStatus:
      type: string
      enum: [pending, accepted, rejected, historical_only]
    ArtifactState:
      type: string
      enum: [staged, sealed, tombstoned]
    EvidenceOrigin:
      type: string
      enum: [live_capture, fixture_capture, imported_unverified]
    ModelMode:
      type: string
      enum: [synthetic, real, unknown]
    NodeEntityType:
      type: string
      enum: [origin, goal, observation, artifact, claim, intent, work_item, agent_run, verification, completion_review, finding, report]
    ReasonDecision:
      type: string
      enum: [propose_intents, wait, propose_completion, blocked]
    TestResult:
      type: string
      enum: [pass, fail, not_run, blocked]
    SuspensionCause:
      type: string
      enum: [user_hold, task_pause, completion_epoch, scope_revoked]
    ReportDeliveryState:
      type: string
      enum: [delivery_pending, ready, incomplete, failed]
    TaskCommandName:
      type: string
      enum: [start, pause, resume, cancel, finish]
    WorkCommandName:
      type: string
      enum: [hold, resume, cancel]
    ApprovalDecisionValue:
      type: string
      enum: [approve, reject]
    CommandDisposition:
      type: string
      enum: [accepted, rejected, already_recorded]
    CommandResourceType:
      type: string
      enum: [task, work_item, approval]
    ViewMode:
      type: string
      enum: [live, history]
    ViewSelectionMode:
      type: string
      enum: [explicit_revision, follow_latest]
    ViewResetAction:
      type: string
      enum: [resnapshot]
    ViewPatchOperation:
      type: string
      enum: [upsert_node, remove_node, upsert_edge, remove_edge]
    CaptureCompleteness:
      type: string
      enum: [complete, partial, unknown]
    DispatchStatus:
      type: string
      enum: [prepared, duplicate, rejected]
    ControlAction:
      type: string
      enum: [stop_after_current, stop, query]
    ControlStatus:
      type: string
      enum: [accepted, rejected, already_recorded]
    StartStatus:
      type: string
      enum: [prepared, running, already_recorded, rejected, unknown]
    ScenarioKind:
      type: string
      enum: [ctf, web_single, comprehensive, adversary_emulation, code_audit]
    ErrorCode:
      type: string
      enum:
