          oneOf:
            - $ref: '#/components/schemas/CloseTrigger'
            - type: 'null'
        result_outcome:
          oneOf:
            - $ref: '#/components/schemas/ResultOutcome'
            - type: 'null'
        review: {$ref: '#/components/schemas/CompletionReview'}
        report:
          oneOf:
            - $ref: '#/components/schemas/ReportSummary'
            - type: 'null'
    TaskCompletionCommand:
      type: object
      additionalProperties: false
      required: [action, close_trigger, result_outcome]
      properties:
        action:
          type: string
          enum: [quiesce, close]
        close_trigger:
          type: string
          enum: [goal_satisfied, budget_exhausted, time_limit, no_progress, system_failure, operator_finish]
        result_outcome:
          type: string
          enum: [complete, partial, inconclusive, not_assessed]
        deadline_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 900
    TaskCompletionOutcome:
      type: object
      additionalProperties: false
      required: [disposition, task_id, observed_state, desired_state, control_version, completion_epoch_id, close_trigger, result_outcome, review, report]
      properties:
        disposition:
          type: string
          enum: [quiescing, closed]
        task_id: {type: string, minLength: 1, maxLength: 256}
        observed_state: {$ref: '#/components/schemas/TaskObserved'}
        desired_state: {$ref: '#/components/schemas/TaskDesired'}
        control_version: {$ref: '#/components/schemas/RevisionString'}
        completion_epoch_id:
          oneOf:
            - {type: string, minLength: 1, maxLength: 256}
            - type: 'null'
        close_trigger:
          oneOf:
            - $ref: '#/components/schemas/CloseTrigger'
            - type: 'null'
        result_outcome:
          oneOf:
            - $ref: '#/components/schemas/ResultOutcome'
            - type: 'null'
        review: {$ref: '#/components/schemas/CompletionReview'}
        report:
          oneOf:
            - $ref: '#/components/schemas/ReportSummary'
            - type: 'null'
    ReportAmendmentView:
      type: object
      additionalProperties: false
      required: [amendment_id, reason, authority, source_receipt]
      properties:
        amendment_id: {type: string, minLength: 1, maxLength: 256}
        reason: {type: string, minLength: 1, maxLength: 2048}
        authority:
          type: string
          enum: [assessor, controller]
        source_receipt: {type: object}
    ReportView:
      type: object
      additionalProperties: false
      required: [report_id, task_id, epoch_id, close_trigger, result_outcome, body, body_digest, dispute_state, amendments]
      properties:
        report_id: {type: string, minLength: 1, maxLength: 256}
        task_id: {type: string, minLength: 1, maxLength: 256}
        epoch_id: {type: string, minLength: 1, maxLength: 256}
        close_trigger: {$ref: '#/components/schemas/CloseTrigger'}
        result_outcome: {$ref: '#/components/schemas/ResultOutcome'}
        body: {type: object}
        body_digest: {$ref: '#/components/schemas/Sha256Digest'}
        dispute_state:
          type: string
          enum: [clear, disputed]
        amendments:
          type: array
          maxItems: 4096
          items: {$ref: '#/components/schemas/ReportAmendmentView'}
    DeliveryRequirement:
      type: object
      additionalProperties: false
      required: [role, media_type, min_count, required]
      properties:
        role: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        media_type: {type: string, minLength: 3, maxLength: 129}
        min_count: {type: integer, minimum: 1, maximum: 64}
        required: {type: boolean}
    DeliveryProfile:
      type: object
      additionalProperties: false
      required: [schema_version, profile_id, mode, requirements]
      properties:
        schema_version:
          type: string
          enum: [wuji.delivery-profile.v1]
        profile_id: {type: string, minLength: 1, maxLength: 256}
        mode:
          type: string
          enum: [offline, http]
        requirements:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/DeliveryRequirement'}
    ReportDeliveryCommand:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile: {$ref: '#/components/schemas/DeliveryProfile'}
        exchange:
          oneOf:
            - {type: object}
            - type: 'null'
    DeliveryMaterial:
      type: object
      additionalProperties: false
      required: [source, source_ref, media_type, sha256, size_bytes, access_level]
      properties:
        source: {type: string, enum: [report_commit, artifact]}
        source_ref: {type: string, minLength: 1, maxLength: 512}
        media_type: {type: string, minLength: 3, maxLength: 256}
        sha256: {$ref: '#/components/schemas/Sha256Digest'}
        size_bytes: {type: integer, minimum: 0}
        access_level: {type: integer, minimum: 0}
    DeliveryRequirementReport:
      type: object
      additionalProperties: false
      required: [role, media_type, min_count, required, present_count, present, missing_count]
      properties:
        role: {type: string, minLength: 1, maxLength: 64}
        media_type: {type: string, minLength: 3, maxLength: 129}
        min_count: {type: integer, minimum: 1, maximum: 64}
        required: {type: boolean}
        present_count: {type: integer, minimum: 0}
        present:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/DeliveryMaterial'}
        missing_count: {type: integer, minimum: 0}
    DeliveryMissing:
      type: object
      additionalProperties: false
      required: [role, media_type, min_count, present_count, missing_count, required]
      properties:
        role: {type: string, minLength: 1, maxLength: 64}
        media_type: {type: string, minLength: 3, maxLength: 129}
        min_count: {type: integer, minimum: 1, maximum: 64}
        present_count: {type: integer, minimum: 0}
        missing_count: {type: integer, minimum: 1}
        required: {type: boolean}
    ReportDeliveryManifest:
      type: object
      additionalProperties: false
      required: [schema_version, report_id, report_digest, epoch_id, profile, mode, state, requirements, materials, missing]
      properties:
        schema_version:
          type: string
          enum: [wuji.report-delivery.v1]
        report_id: {type: string, minLength: 1, maxLength: 256}
        report_digest: {$ref: '#/components/schemas/Sha256Digest'}
        epoch_id: {type: string, minLength: 1, maxLength: 256}
        profile: {$ref: '#/components/schemas/DeliveryProfile'}
        mode:
          type: string
          enum: [offline, http]
        state:
          type: string
          enum: [ready, incomplete]
        requirements:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/DeliveryRequirementReport'}
        materials:
          type: array
          maxItems: 501
          items: {$ref: '#/components/schemas/DeliveryMaterial'}
        missing:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/DeliveryMissing'}
    ReportDeliveryView:
      type: object
      additionalProperties: false
      required: [delivery_id, task_id, report_id, report_digest, epoch_id, profile, profile_digest, state, mode, missing, manifest, manifest_digest, exchange, error_code, access_level, created_at]
      properties:
        delivery_id: {type: string, minLength: 1, maxLength: 256}
        task_id: {type: string, minLength: 1, maxLength: 256}
        report_id: {type: string, minLength: 1, maxLength: 256}
        report_digest: {$ref: '#/components/schemas/Sha256Digest'}
        epoch_id: {type: string, minLength: 1, maxLength: 256}
        profile: {$ref: '#/components/schemas/DeliveryProfile'}
        profile_digest: {$ref: '#/components/schemas/Sha256Digest'}
        state:
          type: string
          enum: [delivery_pending, ready, incomplete, failed]
        mode:
          type: string
          enum: [offline, http]
        missing:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/DeliveryMissing'}
        manifest:
          oneOf:
            - $ref: '#/components/schemas/ReportDeliveryManifest'
            - type: 'null'
        manifest_digest:
          oneOf:
            - $ref: '#/components/schemas/Sha256Digest'
            - type: 'null'
        exchange:
          oneOf:
            - {type: object}
            - type: 'null'
        error_code:
          oneOf:
            - {type: string, minLength: 2, maxLength: 64}
            - type: 'null'
        access_level: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
    ReportDeliverySummary:
      type: object
      additionalProperties: false
      required: [delivery_id, report_id, profile_id, mode, state, missing_required, error_code, created_at]
      properties:
        delivery_id: {type: string, minLength: 1, maxLength: 256}
        report_id: {type: string, minLength: 1, maxLength: 256}
        profile_id: {type: string, minLength: 1, maxLength: 256}
        mode:
          type: string
          enum: [offline, http]
        state:
          type: string
          enum: [delivery_pending, ready, incomplete, failed]
        missing_required: {type: integer, minimum: 0}
        error_code:
          oneOf:
            - {type: string, minLength: 2, maxLength: 64}
            - type: 'null'
        created_at: {type: string, format: date-time}
