        operation_id: {type: string, minLength: 1}
        identity: {$ref: '#/components/schemas/RunIdentity'}
        status: {$ref: '#/components/schemas/ControlStatus'}
        process_state: {$ref: '#/components/schemas/RunProcessState'}
        request_id: {type: string, minLength: 1}
    ChatRole:
      type: string
      enum: [system, user, assistant, tool]
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {$ref: '#/components/schemas/ChatRole'}
        content:
          oneOf:
            - type: string
              maxLength: 1048576
            - type: 'null'
        name:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 256
            - type: 'null'
        tool_call_id:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        tool_calls:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/ChatToolCall'}
    ChatToolCallFunction:
      type: object
      additionalProperties: false
      required: [name, arguments]
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        arguments: {type: string, maxLength: 1048576}
    ChatToolCall:
      type: object
      additionalProperties: false
      required: [id, type, function]
      properties:
        id: {type: string, minLength: 1, maxLength: 1024}
        type: {type: string, enum: [function]}
        function: {$ref: '#/components/schemas/ChatToolCallFunction'}
    ChatToolDefinition:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type: {type: string, enum: [function]}
        function:
          type: object
          additionalProperties: false
          required: [name, description, parameters]
          properties:
            name: {type: string, minLength: 1, maxLength: 256}
            description: {type: string, maxLength: 8192}
            parameters:
              type: object
              additionalProperties: true
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages, stream]
      properties:
        model: {type: string, minLength: 1, maxLength: 256}
        messages:
          type: array
          minItems: 1
          maxItems: 4096
          items: {$ref: '#/components/schemas/ChatMessage'}
        tools:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/ChatToolDefinition'}
        tool_choice:
          oneOf:
            - type: string
              enum: [none, auto, required]
            - type: object
              additionalProperties: false
              required: [type, function]
              properties:
                type: {type: string, enum: [function]}
                function:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 256}
        stream: {type: boolean}
        max_tokens: {type: integer, minimum: 1, maximum: 1048576}
        temperature: {type: number, minimum: 0, maximum: 2}
    ChatCompletionChoice:
      type: object
      additionalProperties: false
      required: [index, message, finish_reason]
      properties:
        index: {type: integer, minimum: 0, maximum: 1000000}
        message: {$ref: '#/components/schemas/ChatMessage'}
        finish_reason:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
            - type: 'null'
    TokenUsage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: {type: integer, minimum: 0, maximum: 9223372036854775807}
        completion_tokens: {type: integer, minimum: 0, maximum: 9223372036854775807}
        total_tokens: {type: integer, minimum: 0, maximum: 9223372036854775807}
    ChatCompletionResponse:
      type: object
      additionalProperties: false
      required: [id, object, created, model, choices, usage]
      properties:
        id: {type: string, minLength: 1}
        object: {type: string, enum: [chat.completion]}
        created: {type: integer, minimum: 0, maximum: 9223372036854775807}
        model: {type: string, minLength: 1}
        choices:
          type: array
          items: {$ref: '#/components/schemas/ChatCompletionChoice'}
        usage: {$ref: '#/components/schemas/TokenUsage'}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable, details]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string, minLength: 1, maxLength: 8192}
        request_id: {type: string, minLength: 1, maxLength: 256}
        retryable: {type: boolean}
        details:
          type: object
          additionalProperties: true
