                $ref: '#/components/schemas/ModelVersionPage'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Gone
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
      security:
      - SessionCookie: []
      description: Tenant-scoped versioned model configuration. No inference is performed
        except an explicit connection check. Unknown operations are reconciled without
        resending checks. Writes use stable Idempotency-Key and current authority.
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: wuji_session
      description: Production HttpOnly Secure SameSite session cookie, issued by the backend identity integration.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Bound to the current session; additionally validate Origin on browser writes.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: &id009
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema: *id009
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: *id009
    CommandId:
      name: command_id
      in: path
      required: true
      schema: *id009
    KeyPath:
      name: idempotency_key
      in: path
      required: true
      schema: *id009
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id009
      description: Same key + same canonical request returns the original receipt after reauthorization. Reusing
        a key with a different request returns 409.
    PageSize:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    After:
      name: after
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Cursor'
      description: Opaque task stream cursor. Not an authorization credential.
  schemas:
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    Cursor:
      type: string
      minLength: 1
      maxLength: 512
    Sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    TaskState:
      type: string
      enum:
      - queued
      - provisioning
      - running
      - completing
      - completed
      - pausing
      - paused
      - cancelling
      - cancelled
      - reconciling
      - failed
    TaskAction:
      type: string
      enum:
      - pause
      - resume
      - cancel
    Permission:
      type: string
      enum:
      - project.read
      - model.profile.read
      - task.draft.read
      - task.draft.write
      - task.preview
      - task.read
      - task.create
      - task.control
      - artifact.read
      - artifact.download_sensitive
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - trace_id
      properties:
        code:
          type: string
          enum:
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - VALIDATION_FAILED
          - SCOPE_DENIED
          - PREVIEW_EXPIRED
          - VERSION_CONFLICT
          - IDEMPOTENCY_CONFLICT
          - INVALID_TRANSITION
          - RATE_LIMITED
          - SERVICE_UNAVAILABLE
          - CURSOR_EXPIRED
          - INTERNAL_ERROR
        message:
          type: string
          minLength: 1
          maxLength: 500
        trace_id: *id009
        field_errors:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 128
              message:
                type: string
                minLength: 1
                maxLength: 300
    HealthStatus:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - live
          - ready
    Session:
      type: object
      additionalProperties: false
      required:
      - user_id
      - display_name
      - csrf_token
      - expires_at
      - permissions_version
      properties:
        user_id: *id009
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        csrf_token:
          type: string
          minLength: 1
          maxLength: 256
        expires_at: &id010
          type: string
          format: date-time
        permissions_version:
          $ref: '#/components/schemas/Version'
    Project:
      type: object
      additionalProperties: false
      required:
      - id
      - tenant_id
      - name
      - permissions
      properties:
        id: *id009
        tenant_id: *id009
        name:
          type: string
          minLength: 1
          maxLength: 120
        permissions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Permission'
    Limits:
      type: object
      additionalProperties: false
      required:
      - max_total_requests
      - requests_per_second
      - max_concurrent_requests
      - request_timeout_seconds
      - max_response_bytes
      - max_runtime_seconds
      properties:
        max_total_requests:
          type: integer
          minimum: 1
          maximum: 200
        requests_per_second:
          type: number
          exclusiveMinimum: 0
          maximum: 2
        max_concurrent_requests:
          type: integer
          minimum: 1
          maximum: 2
        request_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 10
        max_response_bytes:
          type: integer
          minimum: 1
          maximum: 1048576
        max_runtime_seconds:
          type: integer
          minimum: 1
          maximum: 600
    ScopeBinding:
      type: object
      additionalProperties: false
      required:
      - policy_id
      - version
      properties:
        policy_id: *id009
        version:
          $ref: '#/components/schemas/Version'
    ApprovedScope:
      type: object
      additionalProperties: false
      required:
      - binding
      - label
      - valid_until
      - origins
      - allowed_path_prefixes
      - excluded_path_prefixes
      - allowed_methods
      - limits
      properties:
        binding:
          $ref: '#/components/schemas/ScopeBinding'
        label:
          type: string
          minLength: 1
          maxLength: 120
        valid_until: *id010
        origins:
          type: array
          maxItems: 20
          items:
            type: string
            format: uri
            pattern: ^https?://
        allowed_path_prefixes:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 2048
        excluded_path_prefixes:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 2048
        allowed_methods:
          type: array
          maxItems: 2
          items:
            type: string
            enum:
            - GET
            - HEAD
        limits:
          $ref: '#/components/schemas/Limits'
    TaskDraft:
      type: object
      additionalProperties: false
      required:
      - name
      - scope
      - target_url
      - tool
      - method
      - limits
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scope:
          $ref: '#/components/schemas/ScopeBinding'
        target_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://
        tool:
          type: string
          const: http_observe
        method:
          type: string
          enum:
          - GET
          - HEAD
        limits:
          $ref: '#/components/schemas/Limits'
    TaskPreview:
      type: object
      additionalProperties: false
      required:
      - preview_id
      - project_id
      - draft
      - input_digest
      - effective_scope
      - expires_at
      - can_create
      - blockers
      properties:
        preview_id: *id009
        project_id: *id009
        draft:
          $ref: '#/components/schemas/TaskDraft'
        input_digest:
          $ref: '#/components/schemas/Sha256'
        effective_scope:
          $ref: '#/components/schemas/ApprovedScope'
        expires_at: *id010
        can_create:
          type: boolean
        blockers:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            properties:
              code:
                type: string
                enum:
                - MISSING_ADAPTER
                - MISSING_IDENTITY
                - SCOPE_DENIED
                - AUTHORIZATION_EXPIRED
                - CREATION_UNAVAILABLE
              message:
                type: string
                minLength: 1
                maxLength: 300
      allOf:
      - if:
          properties:
            can_create:
              const: true
          type: object
        then:
          properties:
            blockers:
              maxItems: 0
              type: array
          type: object
        else:
          properties:
            blockers:
              minItems: 1
              type: array
          type: object
    CreateTask:
      type: object
      additionalProperties: false
      required:
      - preview_id
      - input_digest
      - draft
      properties:
        preview_id: *id009
        input_digest:
          $ref: '#/components/schemas/Sha256'
        draft:
          $ref: '#/components/schemas/TaskDraft'
    TaskControl:
      type: object
      additionalProperties: false
      required:
      - action
      - expected_version
      properties:
        action:
          $ref: '#/components/schemas/TaskAction'
        expected_version:
          $ref: '#/components/schemas/Version'
    ExecutionSummary:
      type: object
      additionalProperties: false
      required:
      - active_calls
      - unknown_calls
      - egress_state
      properties:
        active_calls:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        unknown_calls:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        egress_state:
          type: string
          enum:
          - pending
          - active
          - frozen
          - revoked
          - not_granted
          - unknown
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - tenant_id
      - project_id
      - name
      - target_url
      - scope
      - version
      - state
      - cleanup_state
      - execution
      - allowed_actions
      - assessment_outcome
      - stop_reason
      - created_at
      - updated_at
      properties:
        id: *id009
        tenant_id: *id009
        project_id: *id009
        name:
          type: string
          minLength: 1
          maxLength: 120
        target_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://
        scope:
          $ref: '#/components/schemas/ScopeBinding'
        version:
          $ref: '#/components/schemas/Version'
        state:
          $ref: '#/components/schemas/TaskState'
        cleanup_state:
          type: string
          enum:
          - not_required
          - pending
          - cleaning
          - cleaned
          - cleanup_pending
        execution:
          $ref: '#/components/schemas/ExecutionSummary'
        allowed_actions:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/TaskAction'
        assessment_outcome:
          type: string
          enum:
          - criteria_met
          - partial
          - inconclusive
          - not_assessed
        stop_reason:
          type:
          - string
          - 'null'
          enum:
          - null
          - criteria_met
          - plan_exhausted
          - budget_exhausted
          - deadline_exceeded
          - user_cancelled
          - runtime_error
          - authorization_expired
        created_at: *id010
        updated_at: *id010
      allOf:
      - if:
          properties:
            state:
              enum:
              - completed
              - cancelled
              - failed
          type: object
        then:
          properties:
            execution:
              properties:
                active_calls:
                  const: 0
                unknown_calls:
                  const: 0
                egress_state:
                  enum:
                  - revoked
                  - not_granted
              type: object
            allowed_actions:
              maxItems: 0
              type: array
          type: object
      - if:
          properties:
            state:
              const: paused
          type: object
        then:
          properties:
            execution:
              properties:
                active_calls:
                  const: 0
                unknown_calls:
                  const: 0
                egress_state:
                  const: frozen
              type: object
          type: object
    TaskSnapshot:
      type: object
      additionalProperties: false
      required:
      - task
