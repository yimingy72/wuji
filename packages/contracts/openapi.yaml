openapi: 3.1.1
info:
  title: Wuji Phase 1 Control API
  version: 0.5.0
  description: Reviewable contract baseline, not a running service. Authorized non-destructive HTTP observation
    only. All object reads/writes enforce caller/project/tenant ownership. Cookie authentication plus CSRF and Origin
    checks for writes. Limits and URL syntax validation do not replace server policy enforcement.
servers:
- url: /api/v1
  description: Same-origin platform API
security:
- SessionCookie: []
tags:
- name: Authentication
  description: Browser OIDC entry, callback and application-session logout
- name: Session
  description: Browser session and project discovery
- name: Health
  description: Process and dependency readiness probes
- name: Scopes
  description: Approved scope and canonical preview
- name: Tasks
  description: Durable task commands and read models
- name: Artifacts
  description: Authorized evidence metadata, preview and download
- name: Drafts
  description: User-owned incomplete task intent without execution
- name: Models
  description: Organization model services, published profiles and explicit checks
paths:
  /session:
    get:
      operationId: getSession
      summary: Read current session
      description: Read current session
      tags:
      - Session
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': &id001
          description: Session missing or expired
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id002
          description: Insufficient permission or invalid CSRF/Origin
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id003
          description: Resource unavailable to this caller
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id004
          description: Version, idempotency, transition or expired preview conflict
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410': &id005
          description: Cursor or artifact expired
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id006
          description: Invalid structured input
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id007
          description: Rate limited
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id008
          description: Authority unavailable; fail closed
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &id012
          description: Unexpected server error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters: []
  /auth/login:
    get:
      operationId: beginLogin
      summary: Begin the configured OIDC login flow
      description: Validates the local return path, creates a browser-bound handshake and redirects to the configured identity provider.
      tags:
      - Authentication
      security: []
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
          pattern: ^/projects(?:/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/tasks(?:/(?:new|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))?)?)?/?$
          default: /projects
      responses:
        '302':
          description: Redirect to the configured identity provider
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        '409': *id004
        '422': *id006
        '503': *id008
        '500': *id012
  /auth/callback:
    get:
      operationId: finishLogin
      summary: Complete the current browser-bound OIDC handshake
      description: Always redirects to an allowed local page. Failures expose only a fixed error code and trace identifier.
      tags:
      - Authentication
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: state
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: error
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '303':
          description: Redirect to the allowed return path or fixed login error page
          headers:
            Location:
              required: true
              schema:
                type: string
                pattern: ^/(?:projects(?:/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/tasks(?:/(?:new|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))?)?)?/?|login\?error=(?:UNAUTHENTICATED|FORBIDDEN|SERVICE_UNAVAILABLE|INTERNAL_ERROR)&trace_id=[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current Wuji application session
      tags:
      - Authentication
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '204':
          description: Current application session revoked
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        '401': *id001
        '403': *id002
        '503': *id008
        '500': *id012
  /health/live:
    get:
      operationId: getLiveness
      summary: Report that the API process can serve requests
      tags:
      - Health
      security: []
      servers:
      - url: /
      responses:
        '200':
          description: Process is live
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report database and migration readiness
      tags:
      - Health
      security: []
      servers:
      - url: /
      responses:
        '200':
          description: Required dependencies and migrations are ready
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503': *id008
        '500': *id012
  /projects:
    get:
      operationId: listProjects
      summary: List accessible projects
      description: Lists current memberships ordered by (created_at, id) descending. The signed cursor is bound to this endpoint, caller, permissions version and limit. Tampering or cross-user reuse returns 422; expiry or a changed permissions version returns 410. Every page reauthorizes current membership.
      tags:
      - Session
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '410': *id005
        '422': *id006
        '429': *id007
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageCursor'
  /projects/{project_id}:
    get:
      operationId: getProject
      summary: Read one accessible project
      description: Missing and inaccessible projects both return 404.
      tags:
      - Session
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401': *id001
        '404': *id003
        '422': *id006
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/ProjectId'
  /projects/{project_id}/scopes:
    get:
      operationId: listApprovedScopes
      summary: List usable approved HTTP scope versions
      description: Only approved versions visible to this caller. Preview and creation revalidate expiry and current
        authorization. This read never contacts the target.
      tags:
      - Scopes
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopePage'
        '401': *id001
        '404': *id003
        '410': *id005
        '422': *id006
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageCursor'
  /projects/{project_id}/task-previews:
    post:
      operationId: previewTask
      summary: Preview the effective task scope
      description: Creates a short-lived, caller/project-bound preview. Canonicalization and policy evaluation only;
        no DNS/target/model execution. Phase 1 accepts only approved HTTP observation profiles. GET/HEAD alone do
        not prove absence of side effects.
      tags:
      - Scopes
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPreview'
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id006
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDraft'
      security:
      - SessionCookie: []
        CsrfToken: []
  /projects/{project_id}/tasks:
    get:
      operationId: listTasks
      summary: List tasks with stable cursor pagination
      description: List tasks with stable cursor pagination
      tags:
      - Tasks
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401': *id001
        '404': *id003
        '410': *id005
        '422': *id006
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageCursor'
    post:
      operationId: createTask
      summary: Accept a task creation command
      description: Reauthorize, resolve idempotency, validate caller/project-bound unexpired preview and exact canonical
        draft/digest, then atomically create Task queued + command receipt + Outbox. Cannot grant scope or arbitrary
        tools. Limits may only narrow approved limits. Concurrent same-key requests return one task. Never contact
        a target in this transaction.
      tags:
      - Tasks
      responses:
        '202':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id006
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
      security:
      - SessionCookie: []
        CsrfToken: []
  /projects/{project_id}/tasks/{task_id}:
    get:
      operationId: getTask
      summary: Read an authoritative task snapshot and consistent event cursor
      description: Snapshot and cursor use one consistent committed view. Every later committed change must be replayable
        after this cursor; database sequence allocation alone is not commit ordering. Task terminal states require
        confirmed no active/unknown execution and egress revoked or never granted. Cleanup remains independent.
      tags:
      - Tasks
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSnapshot'
        '401': *id001
        '404': *id003
        '422': *id006
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
  /projects/{project_id}/tasks/{task_id}/commands:
    post:
      operationId: controlTask
      summary: Accept cancellation; reject unsupported pause or resume transitions
      description: Reauthorize first. Same-key replay resolves before expected_version checking and returns the
        original receipt. A new command atomically checks the task version, transitions intent/state, writes receipt
        and Outbox. This batch only transitions never-executed queued tasks directly to cancelled; pause and resume
        return INVALID_TRANSITION. Terminal tasks reject new controls.
      tags:
      - Tasks
      responses:
        '202':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '422': *id006
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskControl'
      security:
      - SessionCookie: []
        CsrfToken: []
  /projects/{project_id}/commands/{command_id}:
    get:
      operationId: getCommand
      summary: Read an immutable acceptance receipt
      description: Project membership and receipt visibility are rechecked. Use task_id to query achieved execution
        state; the receipt does not change when execution later fails.
      tags:
      - Tasks
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '401': *id001
        '404': *id003
        '422': *id006
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CommandId'
  /projects/{project_id}/command-keys/{idempotency_key}:
    get:
      operationId: findCommandByKey
      summary: Reconcile a command whose response was lost
      description: 'Lookup is scoped to caller/project and all task command kinds. A 404 does not prove an in-flight
        transaction failed: resend the identical request with the same key, never mint a new key automatically.
        Minimum server idempotency retention is 24 hours; unknown commands beyond that window require explicit reconciliation.'
      tags:
      - Tasks
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '401': *id001
        '404': *id003
        '422': *id006
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/KeyPath'
  /projects/{project_id}/tasks/{task_id}/events:
    get:
      operationId: listTaskEvents
      summary: Replay persisted task event notices
      description: Phase 1 read API; Phase 2 SSE is not yet exposed. Omitting after returns bounded initial history
        from task sequence zero; supplied after is exclusive. Stable replay cursor ordering must not skip late commits.
        Empty pages preserve cursor, has_more bounds catch-up. Expired cursor returns 410 CURSOR_EXPIRED. Every page
        reauthorizes. No raw credentials or evidence body in events.
      tags:
      - Tasks
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401': *id001
        '404': *id003
        '410': *id005
        '422': *id006
        '503': *id008
        '500': *id012
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - name: after
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Cursor'
        description: Omit to read bounded initial history from task sequence zero. A supplied cursor is exclusive.
      - $ref: '#/components/parameters/PageSize'
  /projects/{project_id}/tasks/{task_id}/artifacts:
    get:
      operationId: listArtifacts
      summary: List authorized artifact metadata
      description: List authorized artifact metadata
      tags:
      - Artifacts
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactPage'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '410': *id005
        '422': *id006
        '429': *id007
        '503': *id008
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageCursor'
  /projects/{project_id}/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      summary: Read authorized artifact metadata
      description: Read authorized artifact metadata
      tags:
      - Artifacts
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '410': *id005
        '422': *id006
        '429': *id007
        '503': *id008
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
  /projects/{project_id}/artifacts/{artifact_id}/preview:
    get:
      operationId: previewArtifact
      summary: Read bounded, redacted text evidence
      description: Phase 1 returns escaped-as-data plain text in JSON only. The UI renders text, never raw HTML.
        Server checks artifact.read and classification, redacts sensitive values, caps content, disables external
        resources, and denies unsupported/unavailable previews.
      tags:
      - Artifacts
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactPreview'
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '410': *id005
        '422': *id006
        '429': *id007
        '503': *id008
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
  /projects/{project_id}/artifacts/{artifact_id}/download:
    get:
      operationId: downloadArtifact
      summary: Download evidence through the authorized API
      description: Reauthorize on every request. Restricted content requires artifact.download_sensitive. Return
        attachment and nosniff; no bucket URL or signed public URL in Phase 1. Expired content returns 410. Audit
        downloads.
      tags:
      - Artifacts
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: Authorized attachment
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401': *id001
        '403': *id002
        '404': *id003
        '409': *id004
        '410': *id005
        '422': *id006
        '429': *id007
        '503': *id008
  /projects/{project_id}/task-drafts:
    get:
      operationId: listTaskDrafts
      summary: listTaskDrafts
      description: User-owned incomplete task intent. Saving does not create a Task,
        grant Scope or contact any external service. PUT uses expected_version=0 for
        create; an immediate identical replay returns the saved version. Reads require
        current project access. Signed pagination binds user, permissions version, project,
        limit and task_drafts purpose.
      tags:
      - Drafts
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Current user draft page
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedTaskDraftPage'
        '401': &draft_id001
          description: Session missing or expired
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &draft_id002
          description: Insufficient permission or invalid CSRF/Origin
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &draft_id003
          description: Resource unavailable to this caller
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &draft_id004
          description: Version, idempotency, transition or expired preview conflict
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410': &draft_id005
          description: Cursor or artifact expired
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &draft_id006
          description: Invalid structured input
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &draft_id007
          description: Unexpected server error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &draft_id008
          description: Authority unavailable; fail closed
          headers:
            Cache-Control:
              schema:
                type: string
