components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: wuji_session
      description: Production HttpOnly Secure SameSite session cookie, issued by the backend identity integration.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Bound to the current session; additionally validate Origin on browser writes.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: &id010
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema: *id010
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: *id010
    CommandId:
      name: command_id
      in: path
      required: true
      schema: *id010
    KeyPath:
      name: idempotency_key
      in: path
      required: true
      schema: *id010
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id010
      description: Same key + same canonical request returns the original receipt after reauthorization. Reusing
        a key with a different request returns 409.
    PageSize:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    After:
      name: after
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Cursor'
      description: Opaque task stream cursor. Not an authorization credential.
  schemas:
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    Cursor:
      type: string
      minLength: 1
      maxLength: 512
    Sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    TaskState:
      type: string
      enum:
      - queued
      - provisioning
      - running
      - completing
      - completed
      - pausing
      - paused
      - cancelling
      - cancelled
      - reconciling
      - failed
    TaskAction:
      type: string
      enum:
      - pause
      - resume
      - cancel
    Permission:
      type: string
      enum:
      - project.read
      - model.profile.read
      - task.draft.read
      - task.draft.write
      - task.preview
      - task.read
      - task.create
      - task.control
      - artifact.read
      - artifact.download_sensitive
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - trace_id
      properties:
        code:
          type: string
          enum:
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - VALIDATION_FAILED
          - SCOPE_DENIED
          - PREVIEW_EXPIRED
          - VERSION_CONFLICT
          - IDEMPOTENCY_CONFLICT
          - INVALID_TRANSITION
          - RATE_LIMITED
          - SERVICE_UNAVAILABLE
          - CURSOR_EXPIRED
          - INTERNAL_ERROR
        message:
          type: string
          minLength: 1
          maxLength: 500
        trace_id: *id010
        field_errors:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 128
              message:
                type: string
                minLength: 1
                maxLength: 300
    HealthStatus:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - live
          - ready
    Session:
      type: object
      additionalProperties: false
      required:
      - user_id
      - display_name
      - csrf_token
      - expires_at
      - permissions_version
      properties:
        user_id: *id010
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        csrf_token:
          type: string
          minLength: 1
          maxLength: 256
        expires_at: &id011
          type: string
          format: date-time
        permissions_version:
          $ref: '#/components/schemas/Version'
    Project:
      type: object
      additionalProperties: false
      required:
      - id
      - tenant_id
      - name
      - permissions
      properties:
        id: *id010
        tenant_id: *id010
        name:
          type: string
          minLength: 1
          maxLength: 120
        permissions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Permission'
    Limits:
      type: object
      additionalProperties: false
      required:
      - max_total_requests
      - requests_per_second
      - max_concurrent_requests
      - request_timeout_seconds
      - max_response_bytes
      - max_runtime_seconds
      properties:
        max_total_requests:
          type: integer
          minimum: 1
          maximum: 200
        requests_per_second:
          type: number
          exclusiveMinimum: 0
          maximum: 2
        max_concurrent_requests:
          type: integer
          minimum: 1
          maximum: 2
        request_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 10
        max_response_bytes:
          type: integer
          minimum: 1
          maximum: 1048576
        max_runtime_seconds:
          type: integer
          minimum: 1
          maximum: 600
    ScopeBinding:
      type: object
      additionalProperties: false
      required:
      - policy_id
      - version
      properties:
        policy_id: *id010
        version:
          $ref: '#/components/schemas/Version'
    ApprovedScope:
      type: object
      additionalProperties: false
      required:
      - binding
      - label
      - valid_until
      - origins
      - allowed_path_prefixes
      - excluded_path_prefixes
      - allowed_methods
      - limits
      properties:
        binding:
          $ref: '#/components/schemas/ScopeBinding'
        label:
          type: string
          minLength: 1
          maxLength: 120
        valid_until: *id011
        origins:
          type: array
          maxItems: 20
          items:
            type: string
            format: uri
            pattern: ^https?://
        allowed_path_prefixes:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 2048
        excluded_path_prefixes:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 2048
        allowed_methods:
          type: array
          maxItems: 2
          items:
            type: string
            enum:
            - GET
            - HEAD
        limits:
          $ref: '#/components/schemas/Limits'
    TaskDraft:
      type: object
      additionalProperties: false
      required:
      - name
      - scope
      - target_url
      - tool
      - method
      - limits
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scope:
          $ref: '#/components/schemas/ScopeBinding'
        target_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://
        tool:
          type: string
          const: http_observe
        method:
          type: string
          enum:
          - GET
          - HEAD
        limits:
          $ref: '#/components/schemas/Limits'
    TaskPreview:
      type: object
      additionalProperties: false
      required:
      - preview_id
      - project_id
      - draft
      - input_digest
      - effective_scope
      - expires_at
      - can_create
      - blockers
      properties:
        preview_id: *id010
        project_id: *id010
        draft:
          $ref: '#/components/schemas/TaskDraft'
        input_digest:
          $ref: '#/components/schemas/Sha256'
        effective_scope:
          $ref: '#/components/schemas/ApprovedScope'
        expires_at: *id011
        can_create:
          type: boolean
        blockers:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            properties:
              code:
                type: string
                enum:
                - MISSING_ADAPTER
                - MISSING_IDENTITY
                - SCOPE_DENIED
                - AUTHORIZATION_EXPIRED
                - CREATION_UNAVAILABLE
              message:
                type: string
                minLength: 1
                maxLength: 300
      allOf:
      - if:
          properties:
            can_create:
              const: true
          type: object
        then:
          properties:
            blockers:
              maxItems: 0
              type: array
          type: object
        else:
          properties:
            blockers:
              minItems: 1
              type: array
          type: object
    CreateTask:
      type: object
      additionalProperties: false
      required:
      - preview_id
      - input_digest
      - draft
      properties:
        preview_id: *id010
        input_digest:
          $ref: '#/components/schemas/Sha256'
        draft:
          $ref: '#/components/schemas/TaskDraft'
    TaskControl:
      additionalProperties: false
      properties:
        action:
          enum:
          - start
          - pause
          - resume
          - cancel
          title: Action
          type: string
        expected_version:
          maximum: 9007199254740991
          minimum: 1
          title: Expected Version
          type: integer
      required:
      - action
      - expected_version
      title: TaskControlRequest
      type: object
    ExecutionSummary:
      type: object
      additionalProperties: false
      required:
      - active_calls
      - unknown_calls
      - egress_state
      properties:
        active_calls:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        unknown_calls:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        egress_state:
          type: string
          enum:
          - pending
          - active
          - frozen
          - revoked
          - not_granted
          - unknown
    Task:
      oneOf:
      - $ref: '#/components/schemas/LegacyTask'
      - $ref: '#/components/schemas/WebTask'
    TaskSnapshot:
      additionalProperties: false
      properties:
        task:
          anyOf:
          - $ref: '#/components/schemas/LegacyTask'
          - $ref: '#/components/schemas/WebTask'
          title: Task
        event_cursor:
          maxLength: 512
          minLength: 1
          title: Event Cursor
          type: string
      required:
      - task
      - event_cursor
      title: TaskSnapshotResponse
      type: object
    CommandReceipt:
      additionalProperties: false
      properties:
        command_id:
          format: uuid
          title: Command Id
          type: string
        idempotency_key:
          format: uuid
          title: Idempotency Key
          type: string
        kind:
          enum:
          - create
          - start
          - cancel
          title: Kind
          type: string
        disposition:
          const: accepted
          title: Disposition
          type: string
        project_id:
          format: uuid
          title: Project Id
          type: string
        task_id:
          format: uuid
          title: Task Id
          type: string
        accepted_at:
          format: date-time
          title: Accepted At
          type: string
        accepted_task_version:
          maximum: 9007199254740991
          minimum: 1
          title: Accepted Task Version
          type: integer
        request_digest:
          pattern: ^[a-f0-9]{64}$
          title: Request Digest
          type: string
      required:
      - command_id
      - idempotency_key
      - kind
      - disposition
      - project_id
      - task_id
      - accepted_at
      - accepted_task_version
      - request_digest
      title: CommandReceiptResponse
      type: object
    TaskEvent:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - event_id
      - cursor
      - tenant_id
      - project_id
      - task_id
      - aggregate_version
      - type
      - occurred_at
      - trace_id
      - summary
      properties:
        schema_version:
          type: string
          const: '1.0'
        event_id: *id010
        cursor:
          $ref: '#/components/schemas/Cursor'
        tenant_id: *id010
        project_id: *id010
        task_id: *id010
        aggregate_version:
          $ref: '#/components/schemas/Version'
        type:
          type: string
          enum:
          - task.changed
          - task.cleanup_changed
          - artifact.available
        occurred_at: *id011
        trace_id: *id010
        summary:
          type: string
          minLength: 1
          maxLength: 500
    Artifact:
      additionalProperties: false
      properties:
        id:
          format: uuid
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        name:
          title: Name
          type: string
        mime:
          title: Mime
          type: string
        size:
          minimum: 0
          title: Size
          type: integer
        sha256:
          title: Sha256
          type: string
        state:
          title: State
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
      required:
      - id
      - kind
      - name
      - mime
      - size
      - sha256
      - state
      - created_at
      title: Artifact
      type: object
    ArtifactPreview:
      type: object
      additionalProperties: false
      required:
      - artifact_id
      - text
      - truncated
      - redacted
      properties:
        artifact_id: *id010
        text:
          type: string
          maxLength: 65536
        truncated:
          type: boolean
        redacted:
          type: boolean
          const: true
    ProjectPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Project'
        next_cursor: &id012
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 512
    ScopePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ApprovedScope'
        next_cursor: *id012
    TaskPage:
      additionalProperties: false
      properties:
        items:
          items:
            anyOf:
            - $ref: '#/components/schemas/LegacyTask'
            - $ref: '#/components/schemas/WebTask'
          maxItems: 100
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      - next_cursor
      title: TaskPageResponse
      type: object
    ArtifactPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Artifact'
          maxItems: 100
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      - next_cursor
      title: ArtifactPage
      type: object
    EventPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - has_more
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskEvent'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
        has_more:
          type: boolean
    CodeAuditDraft:
      additionalProperties: false
      not:
        properties:
          repository_url:
            type: string
          source_reference_id:
            type: string
        required:
        - repository_url
        - source_reference_id
      properties:
        schema_version:
          const: '1.0'
          default: '1.0'
          title: Schema Version
          type: string
        name:
          default: ''
          maxLength: 120
          title: Name
          type: string
        objective:
          default: ''
          maxLength: 8000
          title: Objective
          type: string
        starting_point:
          default: ''
          maxLength: 8000
          title: Starting Point
          type: string
        constraints:
          default: ''
          maxLength: 4000
          title: Constraints
          type: string
        reference_ids:
          items:
            format: uuid
            type: string
          maxItems: 20
          title: Reference Ids
          type: array
        model_profile_version_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          default: null
          title: Model Profile Version Id
        runtime_profile_version_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          default: null
          title: Runtime Profile Version Id
        budget_usd:
          anyOf:
          - pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$
            type: string
          - type: 'null'
          default: null
          not:
            enum:
            - '0'
            - '0.0'
            - '0.00'
            - '0.000'
            - '0.0000'
            - '0.00000'
            - '0.000000'
          title: Budget Usd
        scenario:
          const: code_audit
          title: Scenario
          type: string
        repository_url:
          anyOf:
          - maxLength: 2048
            type: string
          - type: 'null'
          default: null
          title: Repository Url
        source_reference_id:
          anyOf:
          - format: uuid
            type: string
