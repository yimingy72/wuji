openapi: 3.1.1
info:
  title: Wuji Phase 1 Control API
  version: 0.5.0
  description: Reviewable contract baseline, not a running service. Authorized non-destructive HTTP observation
    only. All object reads/writes enforce caller/project/tenant ownership. Cookie authentication plus CSRF and Origin
    checks for writes. Limits and URL syntax validation do not replace server policy enforcement.
servers:
- url: /api/v1
  description: Same-origin platform API
security:
- SessionCookie: []
tags:
- name: Authentication
  description: Browser OIDC entry, callback and application-session logout
- name: Session
  description: Browser session and project discovery
- name: Health
  description: Process and dependency readiness probes
- name: Scopes
  description: Approved scope and canonical preview
- name: Tasks
  description: Durable task commands and read models
- name: Artifacts
  description: Authorized evidence metadata, preview and download
- name: Drafts
  description: User-owned incomplete task intent without execution
- name: Models
  description: Organization model services, published profiles and explicit checks
paths:
  /session:
    get:
      operationId: getSession
      summary: Read current session
      description: Read current session
      tags:
      - Session
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': &id005
          description: Session missing or expired
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id006
          description: Insufficient permission or invalid CSRF/Origin
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id007
          description: Resource unavailable to this caller
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id001
          description: Version, idempotency, transition or expired preview conflict
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410': &id008
          description: Cursor or artifact expired
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id002
          description: Invalid structured input
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id009
          description: Rate limited
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id003
          description: Authority unavailable; fail closed
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &id004
          description: Unexpected server error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters: []
  /auth/login:
    get:
      operationId: beginLogin
      summary: Begin the configured OIDC login flow
      description: Validates the local return path, creates a browser-bound handshake and redirects to the configured
        identity provider.
      tags:
      - Authentication
      security: []
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
          default: /projects
        description: Allowlisted local project/task/draft or tenant-model route; unsupported routes are rejected.
      responses:
        '302':
          description: Redirect to the configured identity provider
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        '409': *id001
        '422': *id002
        '503': *id003
        '500': *id004
  /auth/callback:
    get:
      operationId: finishLogin
      summary: Complete the current browser-bound OIDC handshake
      description: Always redirects to an allowed local page. Failures expose only a fixed error code and trace
        identifier.
      tags:
      - Authentication
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: state
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: error
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '303':
          description: Redirect to the allowed return path or fixed login error page
          headers:
            Location:
              required: true
              schema:
                type: string
                pattern: ^/(?:projects(?:/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/tasks(?:/(?:new|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}))?)?)?/?|login\?error=(?:UNAUTHENTICATED|FORBIDDEN|SERVICE_UNAVAILABLE|INTERNAL_ERROR)&trace_id=[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current Wuji application session
      tags:
      - Authentication
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '204':
          description: Current application session revoked
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        '401': *id005
        '403': *id006
        '503': *id003
        '500': *id004
  /health/live:
    get:
      operationId: getLiveness
      summary: Report that the API process can serve requests
      tags:
      - Health
      security: []
      servers:
      - url: /
      responses:
        '200':
          description: Process is live
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report database and migration readiness
      tags:
      - Health
      security: []
      servers:
      - url: /
      responses:
        '200':
          description: Required dependencies and migrations are ready
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503': *id003
        '500': *id004
  /projects:
    get:
      operationId: listProjects
      summary: List accessible projects
      description: Lists current memberships ordered by (created_at, id) descending. The signed cursor is bound
        to this endpoint, caller, permissions version and limit. Tampering or cross-user reuse returns 422; expiry
        or a changed permissions version returns 410. Every page reauthorizes current membership.
      tags:
      - Session
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401': *id005
        '403': *id006
        '404': *id007
        '409': *id001
        '410': *id008
        '422': *id002
        '429': *id009
        '503': *id003
        '500': *id004
      parameters:
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageCursor'
  /projects/{project_id}:
    get:
      operationId: getProject
      summary: Read one accessible project
      description: Missing and inaccessible projects both return 404.
      tags:
      - Session
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401': *id005
        '404': *id007
        '422': *id002
        '503': *id003
        '500': *id004
      parameters:
      - $ref: '#/components/parameters/ProjectId'
  /projects/{project_id}/scopes:
    get:
      operationId: listApprovedScopes
      summary: List usable approved HTTP scope versions
      description: Only approved versions visible to this caller. Preview and creation revalidate expiry and current
        authorization. This read never contacts the target.
      tags:
      - Scopes
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopePage'
        '401': *id005
        '404': *id007
        '410': *id008
        '422': *id002
        '503': *id003
        '500': *id004
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageCursor'
  /projects/{project_id}/task-previews:
    post:
      operationId: previewTask
      summary: Preview the effective task scope
      description: Creates a short-lived, caller/project-bound preview. Canonicalization and policy evaluation only;
        no DNS/target/model execution. Phase 1 accepts only approved HTTP observation profiles. GET/HEAD alone do
        not prove absence of side effects.
      tags:
      - Scopes
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPreview'
        '401': *id005
        '403': *id006
        '404': *id007
        '422': *id002
        '503': *id003
        '500': *id004
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDraft'
      security:
      - SessionCookie: []
        CsrfToken: []
  /projects/{project_id}/tasks:
    get:
      tags:
      - Tasks
      summary: List Tasks
      operationId: list_tasks_api_v1_projects__project_id__tasks_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Gone
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
    post:
      tags:
      - Tasks
      summary: Create Task
      operationId: create_task_api_v1_projects__project_id__tasks_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateTask'
              - $ref: '#/components/schemas/NewCreateTaskRequest'
              title: Command
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
  /projects/{project_id}/tasks/{task_id}:
    get:
      tags:
      - Tasks
      summary: Get Task
      operationId: get_task_api_v1_projects__project_id__tasks__task_id__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSnapshot'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
  /projects/{project_id}/tasks/{task_id}/commands:
    post:
      tags:
      - Tasks
      summary: Control Task
      operationId: control_task_api_v1_projects__project_id__tasks__task_id__commands_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskControl'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Service Unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
  /projects/{project_id}/commands/{command_id}:
    get:
      operationId: getCommand
      summary: Read an immutable acceptance receipt
      description: Project membership and receipt visibility are rechecked. Use task_id to query achieved execution
        state; the receipt does not change when execution later fails.
      tags:
      - Tasks
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '401': *id005
        '404': *id007
        '422': *id002
        '503': *id003
        '500': *id004
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CommandId'
  /projects/{project_id}/command-keys/{idempotency_key}:
    get:
      operationId: findCommandByKey
      summary: Reconcile a command whose response was lost
      description: 'Lookup is scoped to caller/project and all task command kinds. A 404 does not prove an in-flight
        transaction failed: resend the identical request with the same key, never mint a new key automatically.
        Minimum server idempotency retention is 24 hours; unknown commands beyond that window require explicit reconciliation.'
      tags:
      - Tasks
      responses:
        '200':
          description: Successful response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '401': *id005
        '404': *id007
        '422': *id002
        '503': *id003
        '500': *id004
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/KeyPath'
  /projects/{project_id}/tasks/{task_id}/events:
    get:
      tags:
      - Tasks
      summary: List Task Events
      operationId: list_task_events_api_v1_projects__project_id__tasks__task_id__events_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
          title: After
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPageResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Gone
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Content
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
