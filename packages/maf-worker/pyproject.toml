[project]
name = "wuji-maf-worker"
version = "0.1.0"
requires-python = "==3.13.15"
dependencies = [
  "wuji-core",
  "agent-framework-core==1.18.0",
  "agent-framework-openai==1.14.3",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.79.0",
  "kubernetes==36.0.3",
  "psycopg[binary]==3.3.5",
  "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wuji_maf_worker"]

[tool.uv.sources]
wuji-core = { path = "../wuji-core", editable = true }

# Own lock and .venv, with no legacy Cairn/Pi workspace membership.
[tool.uv.workspace]
members = []
