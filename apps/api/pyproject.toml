[project]
name = "wuji-api"
version = "0.2.0"
description = "Wuji platform API"
requires-python = "==3.13.15"
dependencies = [
  "alembic==1.19.2",
  "authlib==1.8.0",
  "fastapi==0.141.1",
  "httpx2==2.12.0",
  "psycopg[binary]==3.3.5",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.4",
]

[project.scripts]
wuji-api = "wuji_api.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wuji_api"]
